<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержать проект</title>
    
    <!-- Твой рабочий скрипт SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAqUJ02axfzH2QPJzOycyz1rIxLseQ8m9bQvC_-NTpB5UfgCXwHiZOZalu5JXeXSU6ORIgzpXh4SnFKI0&components=hosted-buttons&disable-funding=venmo&currency=USD"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .donation-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px; /* Сделали карточку чуть шире */
            width: 90%;
            box-sizing: border-box;
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        h2 {
            color: #2c3e50;
            margin: 0 0 12px 0;
            font-size: 26px;
            font-weight: 600;
        }
        
        p {
            color: #7f8c8d;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        
        /* Исправленный контейнер: убрали flex, разрешили кнопке занимать 100% ширины */
        .paypal-container {
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* Заставляем внутренние элементы PayPal не сжиматься в столбик */
        .paypal-container * {
            max-width: 100% !important;
        }
    </style>
</head>
<body>

    <div class="donation-card">
        <div class="icon">❤️</div>
        <h2>Пожертвовать</h2>
        <p>Ваша поддержка помогает нашему проекту развиваться и делать этот мир немного лучше.</p>
                
        <!-- Контейнер для кнопки -->
        <div class="paypal-container">
            <div id="paypal-container-WV6GY4K8KVKHA"></div>
        </div>
    </div>

    <!-- Твой скрипт инициализации кнопки -->
    <script>
      paypal.HostedButtons({
        hostedButtonId: "WV6GY4K8KVKHA",
      }).render("#paypal-container-WV6GY4K8KVKHA");
    </script>

</body>
</html>
