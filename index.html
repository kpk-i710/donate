<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержать проект</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .donation-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-sizing: border-box;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #7f8c8d;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 25px 0;
        }

        /* Красивая кнопка в стиле PayPal */
        .paypal-btn {
            display: inline-block;
            background-color: #0070ba;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 14px 32px;
            border-radius: 100px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(0, 112, 186, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .paypal-btn:hover {
            background-color: #005ea6;
        }

        .paypal-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="donation-card">
        <div class="icon">❤️</div>
        <h2>Пожертвовать</h2>
        <p>Ваша поддержка помогает нашему проекту развиваться и делать этот мир немного лучше.</p>
        
        <!-- Ссылка на оплату (проверь вкладку Link в PayPal) -->
        <a href="https://www.paypal.com/ncp/payment/TB45JCY75ETQJ" target="_blank" class="paypal-btn">
            Пожертвовать через PayPal
        </a>
    </div>

</body>
</html>
